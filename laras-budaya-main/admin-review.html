<!DOCTYPE html>
<html lang="id">
<head>
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Review — Laras Budaya Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="admin-shell">
  <div id="admin-shell-slot"></div>
  <div class="admin-main">
    <div id="topbar"></div>
    <div class="admin-panel">
      <input type="text" id="search-review" placeholder="Cari review berdasarkan produk atau komentar..." style="padding:9px 14px; border-radius:99px; border:1.5px solid var(--clr-border); min-width:280px; margin-bottom:16px;">
      <table class="data-table">
        <thead><tr><th>Produk</th><th>Pembeli</th><th>Rating</th><th>Komentar</th><th>Tanggal</th><th>Aksi</th></tr></thead>
        <tbody id="review-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="js/icons.js"></script>
<script src="js/seed-data.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script src="js/admin-shared.js"></script>
<script src="js/pages/admin-review.js"></script>
</body>
</html>
